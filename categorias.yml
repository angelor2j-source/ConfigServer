spring:
  application:
    name: categorias

server:
  port: 8081

# Propiedades específicas del microservicio categorias
app:
  nombre: "Servicio Categorias"
  descripcion: "Configuración centralizada para el microservicio categorias"

# Ejemplo de datasource (ajusta según necesites)
spring:
  datasource:
    url: jdbc:h2:mem:categoriasdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
